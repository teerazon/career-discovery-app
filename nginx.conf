server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Friendly URLs rewrites
    location /explore {
        rewrite ^/explore/?$ /pages/explore.html break;
    }

    location /minigames {
        rewrite ^/minigames/?$ /pages/minigames/index.html break;
    }

    location /profile {
        rewrite ^/profile/?$ /pages/profile.html break;
    }

    location /score-summary {
        rewrite ^/score-summary/?$ /pages/score-summary.html break;
    }

    location /faculties {
        rewrite ^/faculties/?$ /pages/guidance/faculties.html break;
    }

    location /universities {
        rewrite ^/universities/?$ /pages/guidance/universities.html break;
    }

    location /login {
        rewrite ^/login/?$ /pages/auth/login.html break;
    }

    location /register {
        rewrite ^/register/?$ /pages/auth/register.html break;
    }

    # Default fallback
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    error_page 404 /index.html;
}
