<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แนะแนวคณะและสาขาวิชา (Faculties & Curriculum) | Career Discovery Platform</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="../../index.html" class="logo-group">
        <div class="logo-icon"><i class="fa-solid fa-compass"></i></div>
        <div class="logo-text">
          <span>CAREER PATH</span>
          <span class="logo-sub">Discovery & Minigame</span>
        </div>
      </a>

      <ul class="nav-links">
        <li><a href="../../index.html" class="nav-link"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
        <li><a href="../explore.html" class="nav-link"><i class="fa-solid fa-magnifying-glass"></i> สำรวจอาชีพ</a></li>
        <li><a href="../minigames/index.html" class="nav-link"><i class="fa-solid fa-gamepad"></i> มินิเกมจำลอง (24h)</a></li>
        <li><a href="faculties.html" class="nav-link active"><i class="fa-solid fa-graduation-cap"></i> คณะและสาขา</a></li>
        <li><a href="universities.html" class="nav-link"><i class="fa-solid fa-building-columns"></i> มหาวิทยาลัย</a></li>
        <li><a href="../profile.html" class="nav-link"><i class="fa-solid fa-user-astronaut"></i> โปรไฟล์</a></li>
      </ul>

      <div class="nav-auth-group">
        <div id="navbar-auth-section"></div>
        <button id="mobile-menu-toggle" class="mobile-toggle"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main style="padding: 3.5rem 0 5rem;">
    <div class="container">
      
      <!-- Top Title -->
      <div style="text-align: center; margin-bottom: 3rem;">
        <span class="badge badge-primary" style="margin-bottom: 0.75rem;">
          <i class="fa-solid fa-book-open-reader"></i> Curriculum & Career Roadmap
        </span>
        <h1 style="font-size: 2.3rem; margin-bottom: 0.75rem;">แนะแนวคณะและสาขาวิชา</h1>
        <p style="color: var(--text-muted); max-width: 680px; margin: 0 auto;">
          เจาะลึกโครงสร้างหลักสูตร ตัวอย่างวิชาที่ต้องเรียนจริง เส้นทางอาชีพ และข้อกำหนดใบประกอบวิชาชีพ
        </p>
      </div>

      <!-- Faculties List -->
      <div style="display: flex; flex-direction: column; gap: 2rem;" id="faculties-list-container">
        <!-- Rendered by JavaScript -->
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="../../assets/js/utils/authCheck.js"></script>
  <script type="module">
    import { FACULTIES_DATA } from '../../assets/js/services/dataService.js';

    const container = document.getElementById('faculties-list-container');

    FACULTIES_DATA.forEach(fac => {
      const card = document.createElement('div');
      card.className = 'card card-glowing';
      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div style="display: flex; align-items: center; gap: 14px;">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.06); color: ${fac.color}; display: flex; align-items: center; justify-content: center; font-size: 1.6rem;">
              <i class="fa-solid ${fac.icon}"></i>
            </div>
            <div>
              <h2 style="font-size: 1.4rem; margin-bottom: 2px;">${fac.name}</h2>
              <span style="font-size: 0.88rem; color: var(--text-dim);">${fac.name_en}</span>
            </div>
          </div>
          <a href="universities.html" class="btn btn-outline btn-sm">
            <i class="fa-solid fa-building-columns"></i> ดูมหาวิทยาลัยที่เปิดสอน
          </a>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;">
          <!-- Branches -->
          <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1.25rem;">
            <h3 style="font-size: 1rem; color: #fff; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px;">
              <i class="fa-solid fa-diagram-project" style="color: ${fac.color};"></i> สาขาวิชายอดนิยม
            </h3>
            <ul style="font-size: 0.88rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; padding-left: 1.2rem;">
              ${fac.branches.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>

          <!-- Sample Courses -->
          <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1.25rem;">
            <h3 style="font-size: 1rem; color: #fff; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px;">
              <i class="fa-solid fa-book" style="color: var(--accent-cyan);"></i> ตัวอย่างวิชาที่ต้องเรียน
            </h3>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              ${fac.sample_courses.map(c => `<span class="badge badge-primary">${c}</span>`).join('')}
            </div>
          </div>

          <!-- Career Paths -->
          <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1.25rem;">
            <h3 style="font-size: 1rem; color: #fff; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px;">
              <i class="fa-solid fa-briefcase" style="color: var(--accent-emerald);"></i> เส้นทางอาชีพหลังสำเร็จการศึกษา
            </h3>
            <ul style="font-size: 0.88rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; padding-left: 1.2rem;">
              ${fac.career_paths.map(p => `<li>${p}</li>`).join('')}
            </ul>
          </div>
        </div>

        <!-- License Alert Box -->
        <div style="background: rgba(99, 102, 241, 0.08); border-left: 4px solid ${fac.color}; border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 1rem 1.25rem; font-size: 0.9rem;">
          <div style="font-weight: 700; color: #fff; margin-bottom: 2px;">
            <i class="fa-solid fa-id-card-clip"></i> ข้อกำหนดใบอนุญาตประกอบวิชาชีพ:
          </div>
          <div style="color: var(--text-muted);">${fac.license_info}</div>
        </div>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
