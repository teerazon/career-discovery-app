<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก (Step 1) | Career Discovery Platform</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="../../index.html" class="logo-group">
        <div class="logo-icon"><i class="fa-solid fa-compass"></i></div>
        <div class="logo-text">
          <span>CAREER PATH</span>
          <span class="logo-sub">Discovery & Minigame</span>
        </div>
      </a>
      <div style="font-size: 0.9rem; color: var(--text-muted);">
        มีบัญชีอยู่แล้ว? <a href="login.html" style="font-weight: 600;">เข้าสู่ระบบ</a>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
      <!-- Stepper Indicator -->
      <div class="stepper-container">
        <div class="step-item active">
          <div class="step-circle">1</div>
          <span>ข้อมูลทั่วไป</span>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step-circle">2</div>
          <span>อาชีพที่สนใจ</span>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step-circle">3</div>
          <span>คณะที่สนใจ</span>
        </div>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">สร้างบัญชีผู้ใช้งาน</h1>
        <p class="auth-subtitle">ขั้นตอนที่ 1: กรอกข้อมูลพื้นฐานเพื่อเริ่มต้นการสำรวจอาชีพ</p>
      </div>

      <form id="register-form">
        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">ชื่อผู้ใช้งาน (Username)<span class="required">*</span></label>
          <input type="text" id="username" class="form-control" placeholder="เช่น somchai_cool หรือ สมชาย" required>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">อีเมล (Email)<span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <!-- Password -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="password">รหัสผ่าน<span class="required">*</span></label>
            <input type="password" id="password" class="form-control" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">ยืนยันรหัสผ่าน<span class="required">*</span></label>
            <input type="password" id="confirm-password" class="form-control" placeholder="พิมพ์รหัสผ่านซ้ำ" minlength="6" required>
          </div>
        </div>

        <!-- Education Level -->
        <div class="form-group">
          <label class="form-label" for="education-level">ระดับการศึกษาปัจจุบัน<span class="required">*</span></label>
          <select id="education-level" class="form-control form-select" required>
            <option value="" disabled selected>เลือกระดับการศึกษา...</option>
            <option value="มัธยมศึกษาตอนต้น (ม.1 - ม.3)">มัธยมศึกษาตอนต้น (ม.1 - ม.3)</option>
            <option value="มัธยมศึกษาปีที่ 4">มัธยมศึกษาปีที่ 4</option>
            <option value="มัธยมศึกษาปีที่ 5">มัธยมศึกษาปีที่ 5</option>
            <option value="มัธยมศึกษาปีที่ 6">มัธยมศึกษาปีที่ 6</option>
            <option value="อาชีวศึกษา (ปวช. / ปวส.)">อาชีวศึกษา (ปวช. / ปวส.)</option>
            <option value="ปริญญาตรี / กำลังศึกษาในมหาวิทยาลัย">ปริญญาตรี / กำลังศึกษาในมหาวิทยาลัย</option>
            <option value="บุคคลทั่วไป / กำลังค้นหาอาชีพใหม่">บุคคลทั่วไป / กำลังค้นหาอาชีพใหม่</option>
          </select>
        </div>

        <!-- Phone & Province -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="phone">เบอร์โทรศัพท์</label>
            <input type="tel" id="phone" class="form-control" placeholder="08xxxxxxxx">
          </div>
          <div class="form-group">
            <label class="form-label" for="province">จังหวัด<span class="required">*</span></label>
            <select id="province" class="form-control form-select" required>
              <option value="" disabled selected>เลือกจังหวัด...</option>
              <!-- Populated by JavaScript -->
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          ต่อไป: เลือกอาชีพที่สนใจ (Step 2) <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { authService } from '../../assets/js/services/authService.js';
    import { PROVINCES_TH } from '../../assets/js/services/dataService.js';
    import { showToast } from '../../assets/js/utils/router.js';

    // Populate provinces dropdown
    const provinceSelect = document.getElementById('province');
    PROVINCES_TH.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      if (p === 'กรุงเทพมหานคร') opt.selected = true;
      provinceSelect.appendChild(opt);
    });

    // Form submit handler
    const form = document.getElementById('register-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const education_level = document.getElementById('education-level').value;
      const phone = document.getElementById('phone').value.trim();
      const province = document.getElementById('province').value;

      if (password !== confirmPassword) {
        showToast('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน', 'error');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังสร้างบัญชี...';

      const res = await authService.register({
        username,
        email,
        password,
        education_level,
        phone,
        province
      });

      if (res.success) {
        showToast('ลงทะเบียนสำเร็จ! กำลังไปยังขั้นตอน Onboarding...', 'success');
        setTimeout(() => {
          window.location.href = 'onboarding-careers.html';
        }, 1000);
      } else {
        showToast(res.error || 'เกิดข้อผิดพลาดในการลงทะเบียน', 'error');
        btn.disabled = false;
        btn.innerHTML = 'ต่อไป: เลือกอาชีพที่สนใจ (Step 2) <i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
