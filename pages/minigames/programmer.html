<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมจำลองโปรแกรมเมอร์ (Software Engineer Simulation) | Career Discovery Platform</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/games.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="game-viewport">
    <div class="game-container">
      
      <!-- Simulation HUD -->
      <div class="game-hud">
        <div class="hud-career-info">
          <div class="hud-icon" style="background: linear-gradient(135deg, #6366f1, #4338ca);">
            <i class="fa-solid fa-code"></i>
          </div>
          <div class="hud-details">
            <h2>โปรแกรมเมอร์ (Software Engineer)</h2>
            <p>24-Hour Sprint & Debugging Simulation</p>
          </div>
        </div>

        <div class="hud-stats-group">
          <div class="hud-stat-box">
            <div class="hud-stat-label">ช่วงเวลา</div>
            <div class="hud-stat-val" id="hud-time" style="font-size:1.05rem; color:#818cf8;">10:00 น.</div>
          </div>
          <div class="hud-stat-box">
            <div class="hud-stat-label">คะแนนสะสม</div>
            <div class="hud-stat-val" id="hud-score" style="color:#ffffff;">0 / 100</div>
          </div>
          <a href="index.html" class="btn btn-ghost btn-sm" title="ออกจากการจำลอง" style="color:var(--text-dim);">
            <i class="fa-solid fa-xmark"></i> ออก
          </a>
        </div>
      </div>

      <!-- 24-Hour Timeline Checkpoints -->
      <div class="sim-timeline">
        <div class="timeline-checkpoint active">
          <div class="timeline-dot"></div>
          <span>10:00 น. วางแผน Sprint P0</span>
        </div>
        <div style="flex:1; height:2px; background:var(--border-subtle);"></div>
        <div class="timeline-checkpoint">
          <div class="timeline-dot"></div>
          <span>14:00 น. แกะบั๊ก TypeError</span>
        </div>
        <div style="flex:1; height:2px; background:var(--border-subtle);"></div>
        <div class="timeline-checkpoint">
          <div class="timeline-dot"></div>
          <span>17:00 น. Hotfix ลูกค้า ASAP</span>
        </div>
      </div>

      <!-- Interactive Stage Container -->
      <div id="game-stage-container">
        <!-- Rendered by programmer.js -->
      </div>

    </div>
  </div>

  <script type="module">
    import { initProgrammerGame } from '../../assets/js/games/programmer.js';
    document.addEventListener('DOMContentLoaded', () => {
      initProgrammerGame();
    });
  </script>
</body>
</html>
